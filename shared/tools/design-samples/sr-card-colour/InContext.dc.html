<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The SR pick among the six classes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&amp;family=Titan+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#04A322}a:hover{color:#1B1B2F}
</style>
</helmet>
<div style="width: 1200px; height: 420px; box-sizing: border-box; padding: 44px 56px; background: #FFF4DC; font-family: Rubik, system-ui, sans-serif; color: #1B1B2F; display: flex; flex-direction: column; gap: 34px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Titan One', 'Arial Black', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.1">One card per class</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5A5A74">The picker's six class colours side by side, SR in the pick. Try the other candidates from Tweaks.</p>
  </div>
  <div style="display: flex; gap: 36px">
    <sc-for list="{{cards}}" as="card" hint-placeholder-count="6">
      <div style="position: relative; width: 140px; height: 168px; box-sizing: border-box; background: #FFFFFF; border: 3px solid #1B1B2F; border-radius: 18px; box-shadow: 5px 5px 0 #1B1B2F; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 16px">
        <img src="{{card.src}}" alt="{{card.name}}" style="width: 96px; height: 96px; object-fit: cover; border-radius: 14px; background: {{card.bg}}">
        <span style="font-weight: 800; font-size: 16px">{{card.name}}</span>
        <span style="position: absolute; top: -13px; right: -10px; padding: 2px 9px; border-radius: 999px; border: 2px solid #1B1B2F; background: {{card.bg}}; color: {{card.ink}}; font-family: 'Titan One', 'Arial Black', sans-serif; font-size: 13px">{{card.tag}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sr":{"editor":"color","default":"#04A322","options":["#04A322","#15803D","#9E0008","#1B1B2F"]},"$preview":{"width":1200,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const sr = this.props.sr ?? '#04A322';
    const lin = (c) => { c = c / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const h = sr.replace('#', '');
    const lum = 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
    const whiteRatio = 1.05 / (lum + 0.05);
    const inkRatio = (lum + 0.05) / (0.0118 + 0.05);
    const srInk = whiteRatio >= inkRatio ? '#FFFFFF' : '#1B1B2F';
    const cards = [
      { name: 'Saori', tag: 'AR', bg: '#3EE0FF', ink: '#1B1B2F', src: '/_blob/beef6f438d3d43431014e7b371c1eddf' },
      { name: 'Fubuki', tag: 'RF', bg: '#C9B2FF', ink: '#1B1B2F', src: '/_blob/d9d1ce62c97f0857d32ce3b462ee9e5d' },
      { name: 'Atsuko', tag: 'SMG', bg: '#C6F24A', ink: '#1B1B2F', src: '/_blob/1740bfeded93b210db0ee84b2cf4cbf5' },
      { name: 'Hoshino', tag: 'SG', bg: '#FFE45C', ink: '#1B1B2F', src: '/_blob/b537d31041041c0af5210561c1af9de8' },
      { name: 'Maki', tag: 'MG', bg: '#2F5BEA', ink: '#FFFFFF', src: '/_blob/81d55c71befe284e1f7025d7c1dc4317' },
      { name: 'Hiyori', tag: 'SR', bg: sr, ink: srInk, src: '/_blob/6e4686b26caf48600caf18274284323c' }
    ];
    return { cards };
  }
}
</script>
</body>
</html>
