<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GunVS lobby — direction B, Arcade (phone, landscape)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#2A86D6}a:hover{color:#1C6BB0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #F5F7FB; color: #1A1F36; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 12px 16px 14px; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 38px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #FF6B5A">GunVS</span>
      <span style="font-size: 13px; font-weight: 700; color: #5F6B85; background: #FFFFFF; border: 1px solid #DDE3EE; border-radius: 999px; padding: 4px 10px">Lobby</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" aria-label="Guide" style="width: 38px; height: 38px; border-radius: 999px; border: 1px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"></path><path d="M12 17h.01"></path></svg></button>
      <button type="button" aria-label="Settings" style="width: 38px; height: 38px; border-radius: 999px; border: 1px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
    </div>
  </div>

  <div style="display: flex; gap: 12px; flex: 1 1 auto; min-height: 0">
    <a href="#unit" style="width: 236px; text-decoration: none; color: #1A1F36; display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 2px solid #DDE3EE; overflow: hidden">
      <div style="position: relative; flex: 1 1 auto; min-height: 0; background: #E8F2FC">
        <img src="/_blob/6e77f6e89804888446ccb5523307433a" alt="Hina" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block">
        <span style="position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 800; color: #FFFFFF; background: #FF6B5A; border-radius: 999px; padding: 4px 10px">Your unit</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; gap: 8px">
        <div style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">Hina</span>
          <span style="font-size: 12px; font-weight: 700; color: #5F6B85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Machine Gun · 32–46 m</span>
        </div>
        <span style="font-size: 13px; font-weight: 800; color: #2A86D6; white-space: nowrap">Change</span>
      </div>
    </a>

    <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 64px; font-size: 12px; font-weight: 800; color: #5F6B85">Play as</span>
        <div style="display: flex; gap: 6px; flex: 1 1 0">
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #3DA5F4; background: #3DA5F4; color: #FFFFFF; font-weight: 800; font-size: 14px">Shooter</button>
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; font-weight: 700; font-size: 14px">Commander</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 64px; font-size: 12px; font-weight: 800; color: #5F6B85">Teams</span>
        <div style="display: flex; gap: 6px; flex: 1 1 0">
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #3DA5F4; background: #3DA5F4; color: #FFFFFF; font-weight: 800; font-size: 14px">1v1</button>
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; font-weight: 700; font-size: 14px">2v2</button>
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; font-weight: 700; font-size: 14px">3v3</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 64px; font-size: 12px; font-weight: 800; color: #5F6B85">Rules</span>
        <div style="display: flex; gap: 6px; flex: 1 1 0">
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #3DA5F4; background: #3DA5F4; color: #FFFFFF; font-weight: 800; font-size: 14px">Standard</button>
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; font-weight: 700; font-size: 14px">Sudden Death</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 64px; font-size: 12px; font-weight: 800; color: #5F6B85">Where</span>
        <div style="display: flex; gap: 6px; flex: 1 1 0">
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #3DA5F4; background: #3DA5F4; color: #FFFFFF; font-weight: 800; font-size: 14px">Offline · bots</button>
          <button type="button" style="flex: 1 1 0; height: 40px; border-radius: 999px; border: 2px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; font-weight: 700; font-size: 14px">Online</button>
        </div>
      </div>
    </div>

    <a href="#map" style="width: 236px; text-decoration: none; color: #1A1F36; display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 2px solid #DDE3EE; overflow: hidden">
      <div style="position: relative; flex: 1 1 auto; min-height: 0; background: #E8F2FC">
        <img src="/_blob/6007cf4ed1cbadb22227574435043b5b" alt="District, seen from above" style="width: 100%; height: 100%; object-fit: cover; display: block">
        <span style="position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 800; color: #FFFFFF; background: #3DA5F4; border-radius: 999px; padding: 4px 10px">Map</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; gap: 8px">
        <div style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">District</span>
          <span style="font-size: 12px; font-weight: 700; color: #5F6B85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Large · ladders · underground</span>
        </div>
        <span style="font-size: 13px; font-weight: 800; color: #2A86D6; white-space: nowrap">Change</span>
      </div>
    </a>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 50px">
    <button type="button" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #DDE3EE; background: #FFFFFF; color: #1A1F36; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"></circle></svg>Surprise me</button>
    <button type="button" style="height: 50px; padding: 0 40px; border-radius: 999px; border: 0; background: #FF6B5A; color: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.02em">Start match</button>
  </div>
</div>
</x-dc>
