<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GunVS lobby — F, round 5: the LINE-UP folder and the map memo (phone, landscape), as built in b1105u</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Titan+One&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.wrap{position:relative;width:844px;height:390px;overflow:hidden;background:#FFF4DC;color:#1B1B2F;font-family:Rubik,system-ui,sans-serif}
.blob{position:absolute}
.title{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:'Titan One','Arial Black',sans-serif;font-size:34px;line-height:1;color:#fff;letter-spacing:.02em;transform:rotate(-2deg);text-shadow:3px 0 0 #1B1B2F,-3px 0 0 #1B1B2F,0 3px 0 #1B1B2F,0 -3px 0 #1B1B2F,3px 3px 0 #1B1B2F,-3px -3px 0 #1B1B2F,3px -3px 0 #1B1B2F,-3px 3px 0 #1B1B2F,5px 5px 0 #FF3EA5}
.corner{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:3px solid #1B1B2F;background:#fff;box-shadow:3px 3px 0 #1B1B2F;font-family:'Titan One','Arial Black',sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center;transform:rotate(4deg);padding:0}
.fs{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;border:3px solid #1B1B2F;background:#fff;box-shadow:2px 2px 0 #1B1B2F;display:flex;align-items:center;justify-content:center;padding:0}
.rows{position:absolute;left:268px;top:72px;width:338px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;height:38px}
.lbl{width:68px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#1B1B2F;color:#fff;border-radius:8px;font-weight:800;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.pill{flex:1 1 0;height:38px;border-radius:999px;border:3px solid #1B1B2F;background:#fff;color:#1B1B2F;font-weight:800;font-size:13px;box-shadow:3px 3px 0 #1B1B2F;padding:0}
.pill.on{background:#FF3EA5;color:#fff}
/* THE LINE-UP FOLDER: manila, a 24 px tab, a thumb notch; two sheets inside — your card and the enemy's slip */
.folder{position:absolute;left:16px;top:96px;width:236px;height:272px;box-sizing:border-box;padding:8px;background:#F6D27A;border:4px solid #1B1B2F;border-radius:0 14px 14px 14px;box-shadow:7px 7px 0 #1B1B2F}
.folder::before{content:'LINE-UP';position:absolute;left:12px;top:-24px;width:110px;height:28px;box-sizing:border-box;padding-bottom:4px;background:#F6D27A;border:4px solid #1B1B2F;border-bottom:0;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.08em}
.folder::after{content:'';position:absolute;right:-4px;top:112px;width:14px;height:40px;background:#FFF4DC;border:4px solid #1B1B2F;border-right:0;border-radius:20px 0 0 20px}
.sheet{position:absolute;box-sizing:border-box;background:#fff;border:3px solid #1B1B2F;color:#1B1B2F;text-decoration:none}
.unit{left:10px;top:10px;width:216px;height:186px;border-radius:12px;box-shadow:4px 4px 0 #1B1B2F;transform:rotate(-1.5deg);padding:8px;display:flex;flex-direction:column;gap:5px}
.unit .art{height:108px;border-radius:10px;overflow:hidden;background:#3EE0FF}
.unit .art img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.unit .name{font-family:'Titan One','Arial Black',sans-serif;font-size:20px;line-height:1.05;margin-top:2px}
.unit .sub{font-size:11px;font-weight:700;color:#5A5A74}
.unit .tag{position:absolute;right:10px;top:-14px;padding:5px 10px;border-radius:999px;border:3px solid #1B1B2F;background:#C6F24A;font-size:11px;font-weight:800;letter-spacing:.04em;transform:rotate(4deg);box-shadow:2px 2px 0 #1B1B2F;white-space:nowrap}
.unit .change{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:800;color:#FF3EA5}
.slip{left:12px;top:212px;width:213px;height:50px;border-radius:10px;box-shadow:4px 4px 0 #1B1B2F;transform:rotate(1deg);display:flex;align-items:stretch;overflow:visible}
.slip .face{width:44px;flex:0 0 auto;background:#FFE45C;border-right:3px solid #1B1B2F;border-radius:7px 0 0 7px;overflow:hidden}
.slip .face img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.slip .txt{display:flex;flex-direction:column;justify-content:center;padding:3px 8px;min-width:0}
.slip .txt i{display:block;width:max-content;margin-bottom:1px;padding:0 4px;border-radius:5px;background:#FF3EA5;color:#fff;font-style:normal;font-size:8px;font-weight:800;letter-spacing:.06em}
.slip .txt b{font-family:'Titan One','Arial Black',sans-serif;font-weight:400;font-size:15px;line-height:1.05;white-space:nowrap}
.slip .txt small{font-size:10px;font-weight:700;color:#5A5A74;white-space:nowrap}
.slip .st{position:absolute;right:-6px;top:-9px;padding:3px 8px;border-radius:999px;border:2px solid #1B1B2F;background:#FF3EA5;color:#fff;font-size:10px;line-height:1;font-weight:800;box-shadow:2px 2px 0 #1B1B2F;transform:rotate(3deg)}
/* THE MAP MEMO: a white note, ruled under the picture, hung from a strip of the yellow tape over its top edge */
.memo{position:absolute;left:615px;top:69px;width:218px;height:238px;box-sizing:border-box;background:linear-gradient(#fff,#fff) 0 0/100% 164px no-repeat,repeating-linear-gradient(180deg,transparent 0 16px,rgba(62,224,255,.5) 16px 17px) #fff;border:3px solid #1B1B2F;border-radius:3px;box-shadow:5px 7px 0 rgba(27,27,47,.92);transform:rotate(2.5deg);padding:12px 10px 8px;text-decoration:none;color:#1B1B2F}
.memo .tape{position:absolute;left:50%;top:-9px;width:84px;height:20px;margin-left:-42px;background:rgba(255,228,92,.82) linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);transform:rotate(-5deg);clip-path:polygon(2% 0,98% 3%,100% 22%,97% 40%,100% 60%,98% 80%,100% 100%,1% 97%,0 78%,3% 58%,0 38%,2% 18%);box-shadow:0 1px 2px rgba(27,27,47,.22)}
.memo .photo{height:134px;background:#1B1B2F;border:3px solid #1B1B2F;box-sizing:border-box}
.memo .photo img{width:100%;height:100%;object-fit:contain;display:block}
.memo .name{display:block;margin-top:6px;padding-right:56px;font-family:'Titan One','Arial Black',sans-serif;font-size:20px;line-height:1.05}
.memo .sub{display:block;font-size:11px;font-weight:700;color:#5A5A74}
.memo .sub i{display:inline-block;margin-right:5px;padding:0 4px;border-radius:5px;background:#3EE0FF;color:#1B1B2F;font-style:normal;font-size:8px;font-weight:800;letter-spacing:.06em;vertical-align:1px}
.memo .change{position:absolute;right:12px;top:157px;font-size:12px;font-weight:800;color:#FF3EA5}
.foot{position:absolute;right:16px;top:310px;display:flex;align-items:center;gap:10px}
.allrand{height:42px;padding:0 11px;border-radius:999px;border:3px solid #1B1B2F;background:#FF3EA5;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;box-shadow:3px 3px 0 #1B1B2F;transform:rotate(-2deg)}
.allrand svg+svg{margin-left:-10px}
.online{height:50px;padding:0 20px;border-radius:999px;border:4px solid #1B1B2F;background:#fff;color:#1B1B2F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Titan One','Arial Black',sans-serif;font-size:18px;line-height:1;box-shadow:5px 5px 0 #1B1B2F;transform:rotate(1.5deg)}
.online small{font-family:Rubik,sans-serif;font-weight:800;font-size:9px;letter-spacing:.06em;color:#5A5A74}
.go{width:150px;height:50px;border-radius:999px;border:4px solid #1B1B2F;background:#C6F24A;color:#1B1B2F;font-family:'Titan One','Arial Black',sans-serif;font-size:26px;line-height:1;box-shadow:6px 6px 0 #1B1B2F;transform:rotate(-2deg);padding:0}
</style>
</helmet>
<div class="wrap">
  <div class="blob" style="left:-90px;top:-80px;width:430px;height:360px;background:#C6F24A;border-radius:58% 42% 55% 45% / 50% 60% 40% 50%;transform:rotate(-12deg)"></div>
  <div class="blob" style="right:-140px;bottom:-170px;width:520px;height:400px;background:#FF3EA5;border-radius:45% 55% 40% 60% / 55% 45% 55% 45%;transform:rotate(8deg)"></div>
  <div class="blob" style="left:396px;top:-50px;width:180px;height:130px;background:#3EE0FF;border-radius:60% 40% 50% 50% / 40% 60% 40% 60%;transform:rotate(14deg)"></div>
  <div class="blob" style="left:300px;top:250px;width:26px;height:26px;background:#C6F24A;border-radius:50%"></div>
  <div class="blob" style="left:556px;top:118px;width:18px;height:18px;background:#FF3EA5;border-radius:50%"></div>
  <div class="blob" style="left:470px;top:96px;width:14px;height:14px;background:#3EE0FF;border-radius:50%"></div>

  <button type="button" class="fs" aria-label="Fullscreen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B1B2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <div class="title">GunVS</div>
  <button type="button" class="corner" aria-label="Guide">?</button>

  <div class="folder">
    <a href="#unit" class="sheet unit">
      <span class="tag">YOUR UNIT</span>
      <span class="art"><img src="/_blob/2959371eef3ba105319b3c0b07ad94df" alt="Saori"></span>
      <span class="name">Saori</span>
      <span class="sub">Assault Rifle · M4</span>
      <span class="change">Change</span>
    </a>
    <a href="#enemy" class="sheet slip">
      <span class="face"><img src="/_blob/7463f2d8f4072cf5f5e5bd7b173db6c3" alt="Hoshino"></span>
      <span class="txt"><b>Hoshino</b><small>Shotgun · Beretta 1301</small></span>
      <span class="st">ENEMY</span>
    </a>
  </div>

  <div class="rows">
    <div class="row"><span class="lbl">Play as</span><button type="button" class="pill on">Shooter</button><button type="button" class="pill">Command</button></div>
    <div class="row"><span class="lbl">Teams</span><button type="button" class="pill on">1v1</button><button type="button" class="pill">2v2</button></div>
    <div class="row"><span class="lbl">Roster</span><button type="button" class="pill on">Duel</button><button type="button" class="pill">Trio</button></div>
    <div class="row"><span class="lbl">Rules</span><button type="button" class="pill on">Health Point</button><button type="button" class="pill">Sudden Death</button></div>
    <div class="row"><span class="lbl">Practice</span><button type="button" class="pill">Dummy bots</button><button type="button" class="pill">Spectator</button></div>
  </div>

  <a href="#map" class="memo">
    <span class="tape"></span>
    <span class="photo"><img src="/_blob/4493d8b77ce08a843fd1e30d202f3354" alt="Town"></span>
    <span class="name">Town</span>
    <span class="sub"><i>MAP</i>Scene · 135 × 100 m</span>
    <span class="change">Change</span>
  </a>

  <div class="foot">
    <button type="button" class="allrand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>All random</button>
    <button type="button" class="online">Online<small>VS PLAYER</small></button>
    <button type="button" class="go">GO!!</button>
  </div>
</div>
</x-dc>
